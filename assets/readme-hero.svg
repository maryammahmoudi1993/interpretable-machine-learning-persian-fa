<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title description">
  <title id="title">یادگیری ماشین قابل تفسیر — ترجمه فارسی</title>
  <desc id="description">A book-inspired banner for the Persian translation of Interpretable Machine Learning.</desc>
